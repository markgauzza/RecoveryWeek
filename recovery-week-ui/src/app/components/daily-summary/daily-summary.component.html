<div class="toolbar">
  <button type="button" class="btn-add" (click)="toggleForm()">
    {{ showForm ? '✕' : '+' }}
  </button>
</div>

<app-workout-form
  *ngIf="showForm"
  (saved)="onWorkoutSaved()"
  (cancelled)="onFormCancelled()"
></app-workout-form>

<div *ngIf="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>
<div>{{ loading }}</div>
<table *ngIf="!loading" class="summary-grid">
  <thead>
    <tr>
      <th>Date</th>
      <th>Day</th>
      <th>Workouts</th>
      <th>Sequence</th>
      <th>Parity</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of summaries">
      <td>{{ row.WorkoutDate }}</td>
      <td>{{ row.DayOfWeek }}</td>
      <td>{{ row.Workouts }}</td>
      <td>{{ row.Sequence }}</td>
      <td>{{ row.DayParity }}</td>
    </tr>
    <tr *ngIf="!error && summaries.length === 0">
      <td colspan="5">No summaries found.</td>
    </tr>
  </tbody>
</table>

<div class="paging" *ngIf="!loading && !error">
  <button (click)="prevPage()" [disabled]="skip === 0">Previous</button>
  <span>Showing from {{ skip + 1 }}</span>
  <button (click)="nextPage()" [disabled]="summaries.length < limit">Next</button>
</div>
